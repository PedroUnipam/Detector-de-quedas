# Project-wide Gradle settings.

# ============================
# GRADLE PERFORMANCE & MEMORY
# ============================
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# ============================
# ANDROIDX / JETPACK
# ============================
android.useAndroidX=true
android.enableJetifier=true

# ============================
# BUILD CONFIG
# ============================
android.enablePngCrunchInReleaseBuilds=true
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# ============================
# EXPO IMAGE FORMATS
# ============================
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Expo DevTools Network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Native libs packaging
expo.useLegacyPackaging=false

expo.edgeToEdgeEnabled=true

# ============================
# EXPO SDK 54
# ============================
expo.kotlinVersion=2.1.20

# ============================
# JAVA 17 (CRÍTICO PARA PARAR O ERRO)
# ============================
org.gradle.java.home=C:/Program Files/Java/jdk-17

# Força o Gradle a **não** tentar usar Java 11
systemProp.java.runtime.version=17
systemProp.java.specification.version=17
systemProp.java.version=17

# ============================
# REACT NATIVE / HERMES / NEW ARCH
# ============================
kotlin.code.style=official
edgeToEdgeEnabled=true
newArchEnabled=true
hermesEnabled=true
